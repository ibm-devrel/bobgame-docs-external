<body class="wk-module-1">
  <div class="reveal" data-deck="module-1" data-mode="present"><div class="slides"><section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Note:"><textarea data-template>&lt;!-- .slide: class="wk-title" --&gt;&#10;&#10;&lt;p class="wk-eyebrow"&gt;Module 1 · 15–20 min&lt;/p&gt;&#10;&#10;# The World of Agents&#10;&#10;What an agent is, and how this one is built&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## About 1 in 10&#10;&#10;players have built an agent that solves the full 26-city game on its own.&#10;&#10;Note:&#10;* the game is built on and run by agents, which act non-deterministically: you can't count on them to repeat the same behavior on a new run.&#10;&#10;---&#10;&#10;## What is an agent?&#10;&#10;A software system that uses LLMs to pursue goals, break down problems, and perform tasks.&#10;&#10;- Most agents today use some form of the [ReAct loop](https://arxiv.org/abs/2210.03629)&#10;- Our agent uses elements of it, but:&#10;  - it **never** takes feedback from the human player&#10;  - it's limited in **when** and **how** it can respond, and what it can see when it does&#10;&#10;Note:&#10;Refining agents to solve complex problems takes verification loops, specific targets, and an environment where the agent can improve iteratively. True of all AI agents.&#10;&#10;---&#10;&#10;## The two agents&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### IBM Bob&#10;&#10;- The coding agent you talk to&#10;- General-purpose, ReAct-based&#10;- In a coding harness built for software development&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### The player agent&#10;&#10;- Plays the text adventure&#10;- **Not** general-purpose: only reacts to the game&#10;- Built on **LangGraph**: responds only at specific points in a deterministic workflow&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;---&#10;&#10;## How a general-purpose agent works&#10;&#10;User message → LLM → tool call → result appended → LLM → … → response&#10;&#10;This loop lives inside a **harness**: everything that lets you control the agent's behavior.&#10;&#10;- **System prompt:** your extra instructions on how to behave&#10;- **Skills:** folders of instructions (sometimes with tools) for specific tasks&#10;- **Tools:** functions the agent can call, usually MCP servers&#10;- **Memory:** saved across sessions, retrieved by hooks&#10;- **Filesystem access:** through tools&#10;&#10;Note:&#10;Tool results, memories, and skills all become part of the conversation context. Users control a single session, and compact, clear, or start a new one when it gets too long. In most coding harnesses, messages are append-only.&#10;&#10;---&#10;&#10;## How our player agent differs&#10;&#10;- No skills&#10;- Tools are picked once, in the **MCP Server Shop**&#10;- The **notebook** is its only memory, and leads have a fixed shape: chess piece, finding, where seen, points toward&#10;- Talking to NPCs, notes, travel: all tools&#10;- No filesystem, no internet, nothing outside the game&#10;- The session **resets at every city**. Only the notebook carries over.&#10;&#10;Note:&#10;The human player never speaks. The other messages come from the Narrator and NPC "agents", which only speak when it's their turn. They aren't truly agentic: they can't make arbitrary tool calls and respond to the results.&#10;&#10;Is the player agent in a harness? Maybe: the industry's definition is underspecified. This setup stretches it.&#10;&#10;---&#10;&#10;## Why build agents this way?&#10;&#10;- Controlling **when** the agent responds saves tokens spent deciding whether to respond&#10;- Only seeing the game world means it can't "escape" the game&#10;- Once it's used its tools, it won't keep going for no reason&#10;- Resetting at each city means it can't double down on hallucinated content&#10;&#10;In a real system, this costs far less than a general-purpose agent with a filesystem and the internet.&#10;&#10;---&#10;&#10;## Hooks&#10;&#10;The agent always sees every message as it is. Your Python code can **add** to it.&#10;&#10;- `highlight_narrator_message`, `highlight_npc_message`, `highlight_tool_result`: add a note after a message&#10;- `briefing`: add a note right before each turn&#10;&#10;They all get the **orientation**: where the agent is, where it can go, where it's been, every route it's seen.&#10;&#10;By default they add nothing. Use **deterministic code** to point the LLM at what matters.&#10;&#10;Note:&#10;Examples: pull the connecting cities out of the narrator's scene; count chess pieces in a tool result; total the leads pointing each way; brief the agent on the game state (distance traveled, cities visited); point out connected cities not yet visited.&#10;&#10;Hooks can't hide or change a message. They can read the notebook (`self.notebook`) but not write it. The agent object is new in every city.&#10;&#10;Coding harnesses have hooks too, mostly for guardrails: PII filtering, stripping passwords and confidential information. Those can usually change or hide what the agent sees.&#10;&#10;---&#10;&#10;## The game system&#10;&#10;A LangGraph `StateGraph` for every city visit, with four node types:&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;- The narrator&#10;- The player&#10;- The tools&#10;- The NPCs&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;- Every node appends to a shared `messages` list&#10;- Hooks run on the player's turn, just before its LLM call&#10;- `travel_to` resets the messages: the narrator speaks, the NPC says hello, the loop repeats&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Note:&#10;The other agents don't chime in whenever they want. They only respond to the player agent's behavior.&#10;&#10;---&#10;&#10;## The finale: a verification loop&#10;&#10;- The finale city gives the agent one more tool: `enter_evidence_words`&#10;- The safe tells it how many words were right&#10;- So it can check its notebook, see what's wrong, and make a new plan&#10;&#10;---&#10;&#10;## What's in each message&#10;&#10;Each one looks unstructured. Each one has structure you can pull out in Python.&#10;&#10;| Source | Structure |&#10;|---|---|&#10;| **Narrator** | One structured call, three entries: atmosphere, a bullet per room object, a bullet per exit (city) |&#10;| **NPC** | Hints from the city's story file. Evidence cities: told to reveal the evidence word clearly |&#10;| **Tool results** | `=== Tool Name results ===`, then `--- Finding N [finding_id] ---`, then the content |&#10;&#10;---&#10;&#10;## MCP tools&#10;&#10;Plugins that connect agents to external tools, APIs, and services. Here, they connect the agent to the **game world**.&#10;&#10;```json&#10;{&#10;  "name": "filesystem",&#10;  "description": "Search this resource. Returns ALL available documents at once.",&#10;  "input_schema": {&#10;    "type": "object",&#10;    "properties": { "query": { "type": "string", "default": "search" } }&#10;  }&#10;}&#10;```&#10;&#10;Note:&#10;Every tool result adds atmosphere or conveys a lead. Every lead is a chess piece plus a city, often obscured ("The City of Light" for Paris). LLMs can usually decode these.&#10;&#10;The game is balanced so any combination of MCP servers has enough leads to win.&#10;&#10;---&#10;&#10;## A tool call, and its result&#10;&#10;```json&#10;{ "type": "tool_use", "name": "filesystem", "input": { "query": "search" } }&#10;```&#10;&#10;```text&#10;=== filesystem results ===&#10;&#10;--- Finding 1 [chess_board] (terminal_display) ---&#10;  Black just played b7→b5&#10;  YOUR MOVE&#10;  1. Nf3 — Toronto&#10;  2. d4  — Dublin&#10;=== End of filesystem — 1 finding(s) total. ===&#10;```&#10;&#10;---&#10;&#10;## The notebook&#10;&#10;- The agent's **only** memory between cities&#10;- Written with `record_evidence`, `record_lead`, `take_note`; read back with `check_notebook()`&#10;- Fixable: `revise` an entry (or mark it confirmed), `cross_out` one it no longer trusts&#10;- One freeform note; leads and evidence words have a fixed shape&#10;&#10;That keeps the agent from using its memory as a fun place to put its hallucinations about the storyline.&#10;&#10;---&#10;&#10;## Why can't it just solve the game?&#10;&#10;- The same input can produce different outputs: agents are **non-deterministic**&#10;- After a change, the agent often won't do what you wanted, so it's hard to tell if the change worked&#10;- Be precise with Bob: specific prompts give more consistent results&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## Exercise&#10;&#10;**Ask** → **Plan** → **Agent** → New Game → **Ask**&#10;&#10;Note:&#10;1. Ask: explore the codebase. "What does the LangGraph flow look like?" "What is in an NPC response?" "What should I look for in a tool call response?"&#10;2. Plan: a verification loop at each city, with hooks surfacing information deterministically.&#10;3. Agent: implement the plan.&#10;4. Ask: compare with previous runs. Is the total time going down?&#10;&#10;---&#10;&#10;## What's still hard&#10;&#10;The agent arrives at each city knowing only what's in its notebook.&#10;&#10;- It can't see the map&#10;- It doesn't know how long it's taking&#10;- It trusts a notebook that may be full of misinformation&#10;&#10;Next: what the agent *can't* see, and how to give it the map.&#10;</textarea></section></div></div>
