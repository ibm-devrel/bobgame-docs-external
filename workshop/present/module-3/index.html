<body class="wk-module-3">
  <div class="reveal" data-deck="module-3" data-mode="present"><div class="slides"><section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Note:"><textarea data-template>&lt;!-- .slide: class="wk-title" --&gt;&#10;&#10;&lt;p class="wk-eyebrow"&gt;Module 3 · 20 min&lt;/p&gt;&#10;&#10;# An Experimental Framework for Production Agents&#10;&#10;Test vs. prod, verification loops, and comparing runs&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## Is your agent better?&#10;&#10;How do you know?&#10;&#10;Note:&#10;* you've changed it a few times now. the last run was fast, or slow, or... bad luck?&#10;* agents are stochastic (invariant 3). one run tells you very little. a feeling tells you less.&#10;* every team building agents hits this: somebody changes the prompt, the demo looks good, it ships. a week later nobody can say if it helped.&#10;&#10;---&#10;&#10;## Rules: prompt or code?&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### Code&#10;&#10;"Don't travel to a city you've already visited"&#10;&#10;No judgment needed. Compute it in code.&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### Prompt&#10;&#10;"Decide which lead to trust when two disagree"&#10;&#10;Needs judgment. Put it in the prompt.&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;A rule in a prompt is a suggestion to a stochastic model.&#10;&#10;Note:&#10;* more rules isn't better: each one gets less attention, and they start contradicting each other.&#10;* deterministic where you can, semantic where you have to.&#10;&#10;---&#10;&#10;## A good objective&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### Vague&#10;&#10;"Find the drive"&#10;&#10;"Make my agent better"&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### Good&#10;&#10;1. Record every evidence word correctly&#10;2. Do it fast&#10;3. Open the safe&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Specific, in priority order, measurable.&#10;&#10;Our agent needs: the **objective**, a **strategy** for it, and a way to **check its progress**.&#10;&#10;Note:&#10;* that's how the game is actually scored. evidence words count even if the agent never finishes; finishing puts you at the top.&#10;* how might we use what the game already gives us (the notebook, the tools, the NPC) to check progress more effectively?&#10;* same for Bob: prompting a coding agent is giving it an objective. "make my agent faster" gets you *a* change. "my agent revisits cities in most runs; find out why from the logs, and establish a strategy for detecting cycles using the notebook" gets you much better results.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## Creating a verification loop&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1060 570"&gt; &lt;defs&gt; &lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt; &lt;marker id="wk-arrow-agent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead agent" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt; &lt;/defs&gt; &lt;rect class="node" x="80" y="60" width="300" height="130" rx="8"/&gt; &lt;text class="title mid" x="230" y="108"&gt;1. Act&lt;/text&gt; &lt;text class="sm muted mid" x="230" y="152"&gt;record a lead, travel,&lt;/text&gt; &lt;text class="sm muted mid" x="230" y="178"&gt;enter the words&lt;/text&gt; &lt;rect class="node accent-outline" x="680" y="60" width="300" height="130" rx="8"/&gt; &lt;text class="title mid" x="830" y="108"&gt;2. Check&lt;/text&gt; &lt;text class="sm muted mid" x="830" y="152"&gt;code, the world, a second&lt;/text&gt; &lt;text class="sm muted mid" x="830" y="178"&gt;source, a judge, a human&lt;/text&gt; &lt;rect class="node" x="680" y="350" width="300" height="130" rx="8"/&gt; &lt;text class="title mid" x="830" y="398"&gt;3. Signal&lt;/text&gt; &lt;text class="sm muted mid" x="830" y="442"&gt;short, right before&lt;/text&gt; &lt;text class="sm muted mid" x="830" y="468"&gt;the next decision&lt;/text&gt; &lt;rect class="node" x="80" y="350" width="300" height="130" rx="8"/&gt; &lt;text class="title mid" x="230" y="398"&gt;4. Decide&lt;/text&gt; &lt;text class="sm muted mid" x="230" y="442"&gt;confirm, cross out,&lt;/text&gt; &lt;text class="sm muted mid" x="230" y="468"&gt;or go somewhere else&lt;/text&gt; &lt;line class="edge agent" x1="380" y1="125" x2="670" y2="125"/&gt; &lt;line class="edge" x1="830" y1="190" x2="830" y2="340"/&gt; &lt;line class="edge" x1="680" y1="415" x2="390" y2="415"/&gt; &lt;line class="edge agent" x1="230" y1="350" x2="230" y2="200"/&gt; &lt;line class="edge dashed" x1="150" y1="480" x2="150" y2="545"/&gt; &lt;text class="sm muted" x="175" y="535"&gt;a way out: after a few tries, move on&lt;/text&gt; &lt;text class="sm agent mid" x="525" y="105"&gt;the agent&lt;/text&gt; &lt;text class="sm muted mid" x="530" y="395"&gt;back to the agent&lt;/text&gt; &lt;/svg&gt;&#10;&#10;Note:&#10;* the agent knows it's supposed to find the drive. without a way to confirm progress, it can't tell a good lead from a bad one. it finds out at the safe, at the very end, if it gets there at all.&#10;* the agent is already good at acting. most of the work is in the check and the signal.&#10;&#10;---&#10;&#10;## Choosing a check&#10;&#10;Strongest to weakest:&#10;&#10;1. **Deterministic:** tests, a compiler, a schema, Lean&#10;2. **The environment:** "N of M words correct"&#10;3. **Independent confirmation:** two sources agree&#10;4. **Another LLM:** same invariants as the agent it's checking&#10;5. **A human:** best judgment, doesn't scale&#10;&#10;If you can check it in code, check it in code.&#10;&#10;Note:&#10;* the game defines confirmation for leads: another lead on the same chess piece in the city it named, or an evidence word, or the drive. an NPC repeating a lead doesn't count: that's one source, echoed.&#10;* show an LLM judge the same wrong lead three times and it will probably agree (invariant 6).&#10;* Navier–Stokes: the human check was the one part that couldn't be automated.&#10;&#10;---&#10;&#10;## Getting the signal back&#10;&#10;A check the agent never sees isn't a loop. It's a log entry.&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### Too much&#10;&#10;The whole notebook, every turn&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### Actionable&#10;&#10;"L2 points to Dublin, and you're in Dublin. Nothing here mentions the knight yet. L2 is still unconfirmed."&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Right before the decision. Short.&#10;&#10;Note:&#10;* an LLM focuses on the most recent thing it read: put the signal right before the decision it's meant to change.&#10;* decide: confirm (revise, confirmed=true), cross out, or travel. and a way out: after a few tries, guess and move on.&#10;* your code can **notice**; only the agent can **act**. hooks read self.notebook and the orientation but can't change the notebook.&#10;&#10;---&#10;&#10;## Loops in the game&#10;&#10;| Loop | Check | Signal |&#10;|---|---|---|&#10;| **Every lead** | Does anything here back it up? | "L2 points here. Confirm it or cross it out." |&#10;| **Every move** | Back and forth? (`visited_cities`) | "You've been to Dublin twice." |&#10;| **The finale** | The safe: how many words were right | The reply, plus what it already tried |&#10;| **Every change** | Behavior tests, New Game, logs | What you and Bob read in the logs |&#10;&#10;Note:&#10;* the safe says how many words were right, not which. that's a partial signal. what should the agent do with it?&#10;* behavior tests run in seconds: uv run pytest tests/test_player_behavior.py -n auto -v -m player&#10;&#10;---&#10;&#10;## How loops go wrong&#10;&#10;- **Checking too late:** only at the safe means a full run per lesson&#10;- **Checking the wrong thing:** a count is only as good as its entries&#10;- **Same blind spots:** an LLM grading an LLM&#10;- **A signal it can't act on:** "something is wrong" vs. "L2 and L4 disagree"&#10;- **No way out:** a whole run spent in two cities&#10;&#10;---&#10;&#10;## Building agents with agents&#10;&#10;Bob has the same invariants as the player agent.&#10;&#10;- It can't see the dashboard either&#10;- It doesn't know the codebase (CodeGraph helps it "see" how symbols connect)&#10;- "It works" means it compiles and runs, not that the strategy improved&#10;- Ask for one fix, get three "improvements"&#10;- Talk plans too long, and it implements everything you mentioned&#10;&#10;**Rules** (`AGENTS.md`) · **Testable changes** (logs, compared run to run) · **Checks** (tests, the game) · **Small changes**&#10;&#10;Note:&#10;* AGENTS.md is Bob's system prompt for this repo.&#10;* how can you design tests for the strategic improvements you actually want to see?&#10;&#10;---&#10;&#10;## Test vs. prod&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### 6 cities&#10;&#10;What you play on&#10;&#10;You can see everything&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### 26 cities&#10;&#10;What you're judged on&#10;&#10;You never see it&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;**General truths transfer. Specific truths don't.**&#10;&#10;Note:&#10;* train vs. test. tune too closely to the 6-city game and the agent overfits.&#10;* "leads point to other cities" transfers. "the filesystem tool finds the lead in London" doesn't.&#10;* hardcode the 6-city evidence words and you fail fast on the 26-city game.&#10;* elsewhere: a support-ticket agent tuned on last month's tickets and tested on last month's tickets looks great. test it on this month's.&#10;* keep a set of cases that you and Bob never look at while tuning. if Bob reads your test cases, it will very helpfully tune your agent to pass them.&#10;&#10;---&#10;&#10;## Agents are non-deterministic, so experiment&#10;&#10;- Change **one** thing at a time&#10;- Run each version **more than once**&#10;- Write the results down&#10;- Commit, so you can get back to the winner&#10;&#10;Note:&#10;* time, cities visited, evidence words recorded, finished or not.&#10;* you're looking for the typical result, not the best one.&#10;&#10;---&#10;&#10;## Bigger model?&#10;&#10;Can Opus solve it where Sonnet or Haiku can't?&#10;&#10;- Better at reasoning through messy text&#10;- Slower, and costs more (and this game scores speed)&#10;- Can't see information it was never given&#10;&#10;**Bigger model, or better harness?**&#10;&#10;Note:&#10;* the game uses one model for every agent: narrator, NPCs, player.&#10;* at the workshop: claude-haiku-4-5 and claude-sonnet-4-6 are available. pick your best commit, switch the model, change nothing else, run it twice.&#10;* if the agent doesn't have the map, Opus doesn't have the map either.&#10;* most of what you did in Modules 1 and 2 helps a small model more than a big one. in production, the better harness is usually cheaper.&#10;&#10;---&#10;&#10;## Verification loops beyond coding&#10;&#10;The agent acts → something **outside the agent** checks → the agent hears what was wrong&#10;&#10;- **This game:** `enter_evidence_words`: "N of M words correct"&#10;- **Minecraft:** each step happened or it didn't, and the agents could check&#10;- **Math:** Lean checks the proof&#10;- **Support:** did the customer reopen the ticket?&#10;- **Research:** do the cited papers exist, and say that?&#10;&#10;Note:&#10;* in coding we take these for granted: compiler, type checker, tests, CI. big part of why coding agents got good first.&#10;* real-world problems need the same structure for an agent to make progress without a human. why? the invariants. no map, no belief revision, stochastic. the agent can't notice it's wrong by thinking harder about the same information. the signal has to come from outside the model.&#10;&#10;---&#10;&#10;## Two loops&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### Inner loop&#10;&#10;The player agent, at the safe&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### Outer loop&#10;&#10;You and Bob: change → run → read logs → change&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;This module is about the outer loop.&#10;&#10;---&#10;&#10;## Make experiments traceable&#10;&#10;- Commit after every change (a rule in `AGENTS.md`)&#10;- Match every log to its commit&#10;- Compare runs with Bob&#10;&#10;Note:&#10;* Bob's checkpoints are for undoing what Bob just did, and can roll back the conversation too. commits are your history: messages, they stick around, and you can line them up with logs.&#10;* for this game: merge to main before you submit.&#10;* logs have a start_time. match each one to the most recent commit before it. you can also change the engine locally to log the commit: it won't change how it runs on the server, but it gives you a local loop.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## Exercise&#10;&#10;Commit as you go · Run multiple games · Compare runs · (Try a bigger model)&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-section" --&gt;&#10;&#10;## Loop engineering&#10;&#10;"Keep going until my time is 120."&#10;&#10;Note:&#10;* where did Bob's loop help? where did it go off the rails? did it overfit to the 6-city game? how did it decide a change worked?&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## Submit your agent&#10;&#10;**Submit to Competition** in the game UI. It's judged on the 26-city game: this is where you find out whether it overfit.&#10;&#10;Watch your agent's progress on the [results page](https://ibm-devrel.github.io/bobgame-experience/results/).&#10;&#10;Come chat with us in the Sandbox. Congratulations, and good luck!&#10;</textarea></section></div></div>
