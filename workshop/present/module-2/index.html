<body class="wk-module-2">
  <div class="reveal" data-deck="module-2" data-mode="present"><div class="slides"><section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Note:"><textarea data-template>&lt;!-- .slide: class="wk-title" --&gt;&#10;&#10;&lt;p class="wk-eyebrow"&gt;Module 2 · 20 min&lt;/p&gt;&#10;&#10;# Agents and Non-determinism&#10;&#10;Agent cognition vs. human cognition&#10;&#10;---&#10;&#10;## When humans play games, we…&#10;&#10;- Quickly internalize the rules of a new world&#10;- Set our entire "belief system" around a newly defined goal&#10;- Design strategies to solve them&#10;- Adjust those strategies as we find out the rules nobody told us&#10;&#10;When things shift, we adjust: entirely and fully.&#10;&#10;Note:&#10;* games: fun, but also a way to play with intelligence.&#10;* for the duration of the game, we set aside everything we know and simply believe in the game. we can put down the old and move on with the new.&#10;* goal for this module: walk away with clear intuitions about the shape of problems it's reasonable to apply agents to.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## ARC-AGI-3&#10;&#10;Puzzles made by game designers. LLMs can solve the puzzle.&#10;&#10;The question is: **given no information about the rules, can you internalize them and apply them?**&#10;&#10;Humans figure it out in a few moves. Humans regularly beat LLMs at this task.&#10;&#10;&lt;p class="wk-small"&gt;ARC Prize, ARC-AGI-3 task ls20: arcprize.org/tasks/ls20&lt;/p&gt;&#10;&#10;&lt;img src="/bobgame-docs-external/assets/workshop/module-2/arc-agi-3-ls20.png" alt="ARC-AGI-3 task ls20, level 1 of 7"&gt;&#10;&#10;Note:&#10;[ref] ARC-AGI-3 task ls20: https://arcprize.org/tasks/ls20 (screenshot of level 1 of 7). There's a "human" mode: try one!&#10;&#10;* the reason has to do with how LLMs "think": the output looks like what humans make, but the LLM gets there very differently.&#10;* caveat: this benchmark isn't highly regarded in the research community. it's not necessarily the best benchmark for LLMs, but it illustrates the point.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## Minecraft, October 2026&#10;&#10;Four Gemini agents beat the game in 27 hours, with no human intervention. A fifth "Observer" agent checked their work.&#10;&#10;&lt;img src="/bobgame-docs-external/assets/workshop/module-2/minecraft-gemini-agents-fig1.png" alt="Figure 1: the four Gemini 4 agents and their run, step by step, from bare hands to the Ender Dragon in 27 hours 14 minutes"&gt;&#10;&#10;&lt;p class="wk-small"&gt;Faldor, Singh &amp;amp; Raileanu, "A team of Gemini 4 Argon agents beats Minecraft," arXiv:2610.22319, Oct 15, 2026 (Figure 1)&lt;/p&gt;&#10;&#10;Note:&#10;[ref] Paper: https://arxiv.org/abs/2610.22319 · Figure 1 also shows 605 deaths along the way.&#10;&#10;---&#10;&#10;## What it took to beat Minecraft&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;- Every step **verifiable**&#10;- **4 agents**&#10;- A **coding workspace**&#10;- Coordination over **in-game chat**&#10;- Minecraft strategy **in pretraining**&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;- **Died frequently**, didn't seem to learn&#10;- Most coordination: **mapping the world**&#10;- Little on **strategy** (11/229 messages)&#10;- **1.35B input tokens, 16M output**: ~$520&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Note:&#10;* a state-of-the-art approach to agent development, and we can learn a lot from it.&#10;* Deep Blue Drive Heist is way smaller, and still: about 1 in 10 players have built an agent that solves the full 26-city game.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-section" --&gt;&#10;&#10;## LLM Invariants&#10;&#10;Understanding how agents "think"&#10;&#10;Note:&#10;* not a formal term: a teaching concept. any one of these might be "broken" if it were made a *goal* of LLM training instead of a side effect. under current paradigms they aren't optimized for directly, so they serve as seams between LLMs and humans.&#10;&#10;---&#10;&#10;## LLM Invariants&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;1\. Can't map the world&#10;&#10;2\. Must operate on verification loops&#10;&#10;3\. Stochastic (random) behavior&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;4\. Can't revise beliefs in one session&#10;&#10;5\. Won't shift objectives in one session&#10;&#10;6\. Attention follows frequency&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Underneath all six: the most recent information wins. Noticing it's time to step back and regroup seems uniquely human.&#10;&#10;Note:&#10;* my "list of invariants" as models grow in complexity and power, while staying roughly in the space of the transformer architecture.&#10;&#10;* you can work around every one of these, but you have to know they're there. with a human watching one agent, the human quietly papers over them. alone (like the player agent), or many agents together, they get in the way of the work.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## 1. Can't map the world&#10;&#10;Note:&#10;[ref] Colin Fraser's candle test, his "number one most impossible video model benchmark": https://bsky.app/profile/colin-fraser.net/post/3ld2qwiuyck2w · bicycle and brick wall: https://bsky.app/profile/colin-fraser.net/post/3lekhpzmhtc26&#10;&#10;[ref] "Clean neurons": Nick Cammarata (Goodfire), "Neural Networks Are Already Clean," https://already-clean.goodfire.com&#10;&#10;* at least for now, they don't appear to build "models" of the world in the same way that we do. this is especially evident with the way they fail to reason about the physical world - but you can see that this is equally true for things like software architecture and math.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## "a dog jumps through a hoop"&#10;&#10;Colin Fraser, testing Sora, December 2024&#10;&#10;&lt;video src="/bobgame-docs-external/assets/workshop/module-2/colin-fraser-dog-hoop.mp4" data-autoplay loop muted playsinline&gt;&lt;/video&gt;&#10;&#10;&lt;p class="wk-small"&gt;Colin Fraser on Bluesky, Dec 11, 2024: bsky.app/profile/colin-fraser.net/post/3ld2stb3vb52j&lt;/p&gt;&#10;&#10;Note:&#10;[ref] https://bsky.app/profile/colin-fraser.net/post/3ld2stb3vb52j (Dec 11, 2024), part of his Sora thread that starts with the candle test.&#10;&#10;* it reads "through" and lets the dog phase through the hoop. no understanding of the physics.&#10;* models have advanced since, but elements of this still exist in the most advanced models.&#10;&#10;Plays from a local copy (no internet needed at the venue).&#10;&#10;---&#10;&#10;## Architecture isn't a constraint to an LLM&#10;&#10;- A human who knows model-view-controller notices every time a change would break the pattern&#10;- An LLM echoes what *appears* to be the pattern, if that gets it closer to its goal&#10;- Each piece looks right. The whole doesn't hang together.&#10;&#10;Humans make *translation* errors. LLMs make *conceptual* errors.&#10;&#10;Note:&#10;* building the Deep Blue Heist meant a lot of graph generation algorithms. described them several different ways; the coding agent couldn't translate them without a direct pseudocode implementation.&#10;* even in English, it didn't have a strong conceptual understanding of the task. it understood the words I used, and made rough associations.&#10;* humans who actually understand an algorithm or formula may make translation / encoding errors writing code, but they're unlikely to make conceptual errors that show they don't understand it.&#10;&#10;---&#10;&#10;## Solving the Deep Blue Heist&#10;&#10;**The problem:** Without a map of the world, agents don't understand the quest that they're on.&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;```yaml&#10;cities:&#10;  armonk:    toronto, dublin&#10;  toronto:   armonk, dublin, amsterdam&#10;  dublin:    armonk, toronto, amsterdam, stockholm&#10;  amsterdam: toronto, dublin, stockholm, cairo&#10;  stockholm: dublin, amsterdam, cairo&#10;  cairo:     amsterdam, stockholm&#10;&#10;visited:  armonk -&gt; toronto&#10;location: toronto&#10;```&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;&lt;img src="/bobgame-docs-external/assets/workshop/module-2/bobgame-map.png" alt="Map from the Deep Blue Heist game"&gt;&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Note:&#10;* the agents can't see what you see, and don't see the way you do. without the "map" - of the game, of your org, of your repo - it can't make good decisions.&#10;&#10;* code map: CodeGraph (https://github.com/colbymchenry/codegraph) or tree-sitter (https://tree-sitter.github.io/tree-sitter/)&#10;&#10;* your org: internal wikis, AGENTS.md&#10;&#10;---&#10;&#10;## Even personal assistants need a world model&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;&gt; **Me:** Just put in my laundry. What should I tackle next?&#10;&gt;&#10;&gt; **Agent:** OK, no problem! I'll check off "start personal laundry" from the list. Now you should put your sheets in the wash.&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1350 915"&gt; &lt;defs&gt;&lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt;&lt;/defs&gt; &lt;text class="title mid" x="340" y="60"&gt;state&lt;/text&gt; &lt;text class="title mid" x="955" y="60"&gt;workflow&lt;/text&gt; &lt;rect class="node" x="15" y="165" width="120" height="140" rx="8"/&gt; &lt;line class="edge plain" x1="15" y1="192" x2="135" y2="192"/&gt; &lt;circle class="node" cx="112" cy="179" r="5"/&gt; &lt;circle class="node accent-outline" cx="75" cy="250" r="38"/&gt; &lt;rect class="node accent-outline" x="220" y="195" width="240" height="80" rx="4"/&gt; &lt;text class="sm muted mid" x="340" y="235"&gt;slot&lt;/text&gt; &lt;rect class="node" x="560" y="190" width="170" height="90"/&gt; &lt;text class="mid" x="645" y="235"&gt;sort&lt;/text&gt; &lt;rect class="node" x="760" y="190" width="170" height="90"/&gt; &lt;text class="mid" x="845" y="235"&gt;wash&lt;/text&gt; &lt;line class="edge" x1="730" y1="235" x2="760" y2="235"/&gt; &lt;rect class="node" x="960" y="190" width="170" height="90"/&gt; &lt;text class="mid" x="1045" y="235"&gt;dry&lt;/text&gt; &lt;line class="edge" x1="930" y1="235" x2="960" y2="235"/&gt; &lt;rect class="node" x="1160" y="190" width="170" height="90"/&gt; &lt;text class="mid" x="1245" y="235"&gt;put away&lt;/text&gt; &lt;line class="edge" x1="1130" y1="235" x2="1160" y2="235"/&gt; &lt;text class="emoji mid" x="75" y="640"&gt;🗑️&lt;/text&gt; &lt;rect class="node accent-outline" x="220" y="560" width="240" height="160" rx="4"/&gt; &lt;line class="edge plain muted" x1="245" y1="600" x2="435" y2="600"/&gt; &lt;line class="edge plain muted" x1="245" y1="640" x2="435" y2="640"/&gt; &lt;line class="edge plain muted" x1="245" y1="680" x2="435" y2="680"/&gt; &lt;text class="sm mid" x="340" y="470"&gt;kitchen&lt;/text&gt; &lt;line class="edge" x1="340" y1="490" x2="340" y2="560"/&gt; &lt;text class="sm mid" x="260" y="810"&gt;bath&lt;/text&gt; &lt;line class="edge" x1="260" y1="785" x2="260" y2="720"/&gt; &lt;text class="sm mid" x="420" y="810"&gt;laundry room&lt;/text&gt; &lt;line class="edge" x1="420" y1="785" x2="420" y2="720"/&gt; &lt;rect class="node" x="560" y="595" width="230" height="90"/&gt; &lt;text class="mid" x="675" y="640"&gt;throw away&lt;/text&gt; &lt;rect class="node" x="820" y="595" width="230" height="90"/&gt; &lt;text class="mid" x="935" y="640"&gt;take out&lt;/text&gt; &lt;line class="edge" x1="790" y1="640" x2="820" y2="640"/&gt; &lt;rect class="node" x="1080" y="595" width="230" height="90"/&gt; &lt;text class="mid" x="1195" y="640"&gt;take to curb&lt;/text&gt; &lt;line class="edge" x1="1050" y1="640" x2="1080" y2="640"/&gt; &lt;/svg&gt;&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;Note:&#10;* a voice assistant backed by an LLM, helping manage household tasks. by default it wanted to parallelize laundry: get it all done at once!&#10;* it didn't understand that once the washing machine is in use, nothing more goes in until that load is done and time has passed.&#10;* to get any real help out of it, I had to describe the systems in my house: what state each one can be in, and what steps move it from one state to the next.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## The lens of a floppy disk&#10;&#10;The lens the LLM has to view the world is roughly the size of a few floppy disks' worth of information. The information humanity deals with day-to-day is measured in zettabytes.&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1350 915"&gt; &lt;defs&gt;&lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt;&lt;/defs&gt; &lt;defs&gt;&lt;pattern id="tiny" width="9" height="9" patternUnits="userSpaceOnUse"&gt;&lt;rect class="node fill-strong" x="0" y="0" width="6" height="6"/&gt;&lt;/pattern&gt;&lt;/defs&gt; &lt;rect class="node accent" x="107" y="287.0" width="26" height="26" rx="2"/&gt; &lt;rect class="node" x="114.3" y="287.0" width="11.4" height="7.8"/&gt; &lt;rect class="node" x="111.2" y="301.3" width="17.7" height="9.9"/&gt; &lt;text class="lg mid math" x="120" y="410"&gt;&lt;tspan class="var"&gt;mx&lt;/tspan&gt; + &lt;tspan class="var"&gt;b&lt;/tspan&gt; = &lt;tspan class="var"&gt;y&lt;/tspan&gt;&lt;/text&gt; &lt;text class="sm muted mid" x="120" y="460"&gt;what the model sees:&lt;/text&gt; &lt;text class="sm muted mid" x="120" y="488"&gt;one to three floppy disks&lt;/text&gt; &lt;line class="edge" x1="149" y1="300" x2="250" y2="300"/&gt; &lt;text class="emoji mid" x="320" y="300"&gt;🔎&lt;/text&gt; &lt;line class="edge plain muted" x1="385" y1="260" x2="450" y2="0"/&gt; &lt;line class="edge plain muted" x1="385" y1="340" x2="450" y2="600"/&gt; &lt;rect x="450" y="0" width="900" height="600" fill="url(#tiny)"/&gt; &lt;path class="edge plain" d="M450 620 q0 24 24 24 H876 q24 0 24 24 q0 -24 24 -24 H1326 q24 0 24 -24"/&gt; &lt;text class="lg mid" x="900" y="728"&gt;zettabytes of data&lt;/text&gt; &lt;/svg&gt;&#10;&#10;&lt;p class="wk-small"&gt;1M-token context ≈ 4 MB of text (~4 bytes/token); a floppy holds 1.44 MB. Data created in 2025: ~181 ZB (IDC, via Statista)&lt;/p&gt;&#10;&#10;Note:&#10;[ref] ~4 characters/token: https://ai.google.dev/gemini-api/docs/tokens · 200k tokens ≈ half a floppy; 1M tokens ≈ 3 floppies · data created per year (IDC Global DataSphere, via Statista): 2024 ~149 ZB, 2025 ~181 ZB, 2026 ~221 ZB forecast. https://www.statista.com/statistics/871513/worldwide-data-created/&#10;&#10;[ref] All public human-written text: ~300 trillion tokens (~1 PB), Epoch AI, "Will we run out of data?" (2024). A 1M-token context is ~1/300,000,000 of that.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## ~180 zettabytes of data a year&#10;&#10;≈ 180 million petabytes&#10;&#10;≈ 180 billion terabytes&#10;&#10;≈ 22 one-terabyte laptops for every person on Earth, every year&#10;&#10;&lt;img src="/bobgame-docs-external/assets/workshop/module-2/statista-global-data-creation-2019.jpeg" alt="Statista: global data creation, 2010 to 2035 (2019 forecast)"&gt;&#10;&#10;&lt;p class="wk-small"&gt;~181 ZB created in 2025: IDC, via Statista. Chart: Statista, "Global Data Creation is About to Explode," Apr 2019 (a 2019 forecast)&lt;/p&gt;&#10;&#10;Note:&#10;[ref] Chart is Statista's 2019 forecast (CC BY-ND), https://www.statista.com/chart/17727/global-data-creation-forecasts/ · its 2025 bar (175 ZB) is close to today's ~181 ZB.&#10;&#10;[ref] "Created" counts every copy and stream, a yearly flow. 1 ZB = 1,000,000 PB = 1,000,000,000 TB · ~8.2B people → ~22 TB per person per year.&#10;&#10;---&#10;&#10;## 2. Operate on verification loops&#10;&#10;- Agents only make progress with a **deterministic** check they can run, or something tangible they can observe&#10;- Lean let the Navier–Stokes agents check every step&#10;- Humans use these tools too, but usually already have a strong sense of whether they're right&#10;&#10;---&#10;&#10;## 2. Operate on verification loops&#10;&#10;&gt; The crucial bit of verification that must still be done by humans is to guarantee that the statement being shown to be true in Lean is logically equivalent to what mathematicians set out to prove.&#10;&#10;&lt;p class="wk-small"&gt;&lt;strong&gt;Navier–Stokes, September 2026&lt;/strong&gt; · Quanta, "AI Has Solved One of Math's $1 Million Millennium Prize Problems," Sep 8, 2026&lt;/p&gt;&#10;&#10;Note:&#10;[ref] ~10,000 agents; proof after 88 hours, formalized in Lean 17 hours later: https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/&#10;&#10;[ref] Caveats: forced 3D equations only; priority disputed with Buckmaster &amp; Alpöge: https://www.science.org/content/article/how-ai-math-breakthrough-ignited-controversy&#10;&#10;* Minecraft is a verifiable quest too: thirteen checkable steps, plus an Observer agent.&#10;&#10;* in the game: the finale safe is the verification loop. everywhere else, the agent doesn't know if it's on the right trail unless you give it a way to tell.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## 3. Stochastic behavior&#10;&#10;They're probabilistic machines, by definition. Even if you tune the weights very strongly, 1/100 times 2+2 might = 5, not 4.&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1350 915"&gt; &lt;defs&gt;&lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt;&lt;/defs&gt; &lt;rect class="node" x="0" y="250" width="150" height="120"/&gt; &lt;text class="lg mid" x="75" y="310"&gt;2&lt;/text&gt; &lt;rect class="node" x="0" y="545" width="150" height="120"/&gt; &lt;text class="lg mid" x="75" y="605"&gt;2&lt;/text&gt; &lt;line class="edge plain muted" x1="150" y1="310" x2="475" y2="230"/&gt; &lt;line class="edge plain muted" x1="150" y1="605" x2="475" y2="230"/&gt; &lt;line class="edge plain muted" x1="575" y1="230" x2="775" y2="457"/&gt; &lt;circle class="node" cx="525" cy="230" r="50"/&gt; &lt;line class="edge plain muted" x1="150" y1="310" x2="475" y2="457"/&gt; &lt;line class="edge plain muted" x1="150" y1="605" x2="475" y2="457"/&gt; &lt;line class="edge plain muted" x1="575" y1="457" x2="775" y2="457"/&gt; &lt;circle class="node" cx="525" cy="457" r="50"/&gt; &lt;line class="edge plain muted" x1="150" y1="310" x2="475" y2="685"/&gt; &lt;line class="edge plain muted" x1="150" y1="605" x2="475" y2="685"/&gt; &lt;line class="edge plain muted" x1="575" y1="685" x2="775" y2="457"/&gt; &lt;circle class="node" cx="525" cy="685" r="50"/&gt; &lt;circle class="node" cx="825" cy="457" r="50"/&gt; &lt;line class="edge" x1="875" y1="457" x2="960" y2="457"/&gt; &lt;text class="lg" x="980" y="390"&gt;4&lt;/text&gt; &lt;rect class="node accent" x="1030" y="355" width="220" height="50"/&gt; &lt;text class="sm" x="1260" y="390"&gt;99 / 100&lt;/text&gt; &lt;text class="lg" x="980" y="500"&gt;5&lt;/text&gt; &lt;rect class="node accent" x="1030" y="465" width="6" height="50"/&gt; &lt;text class="sm" x="1050" y="500"&gt;1 / 100&lt;/text&gt; &lt;/svg&gt;&#10;&#10;&lt;p class="wk-small"&gt;An intentional simplification: real networks are more interpretable than this. See "Neural Networks Are Already Clean" (Goodfire, 2026).&lt;/p&gt;&#10;&#10;Note:&#10;[ref] Goodfire, "Neural Networks Are Already Clean": https://already-clean.goodfire.com&#10;&#10;* same agent, same prompt, different decisions on different runs. "intelligence" alone won't change this: it's fundamental to understanding what agents will do.&#10;&#10;* they will always need the ability to form verification loops: that's what catches the 1/100.&#10;&#10;* in the game: never judge a change to your agent by one run.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## 4. Can't revise beliefs&#10;&#10;Given two conflicting pieces of information, they flip between acting as if one is true and acting as if the other is.&#10;&#10;Or: "you said A **and** B, so therefore…"&#10;&#10;Their "cognition" is *additive*. They can't easily return to prior states.&#10;&#10;&lt;img src="/bobgame-docs-external/assets/workshop/module-2/arc-agi-3-ls20.png" alt="ARC-AGI-3 task ls20, level 1 of 7"&gt;&#10;&#10;Note:&#10;* similarly, they cannot easily revise their beliefs: given two conflicting pieces of information, rather than seeking to resolve the reality they're working with first, they will flip probabilistically between acting as if one is true or the other. (or, sometimes, they'll say "you said A AND B, so therefore…" and then make up a new, random, hallucinated state of reality in which both A and B can be true.) their "cognition" is conceptually _additive_, and they can't easily return to prior states.&#10;&#10;* ARC-AGI-3 again: learning the rules as you play means noticing your guess was wrong and replacing it.&#10;&#10;* in the game: the notebook is "fact"... but it was written by an LLM.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## 5. Can't shift objectives&#10;&#10;Four people giving agents roughly the same prompts (but worded slightly differently) will build systems with massively different architectures.&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1350 915"&gt; &lt;defs&gt;&lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt;&lt;/defs&gt; &lt;text class="sm muted" x="0" y="60"&gt;roughly the same prompt, worded slightly differently&lt;/text&gt; &lt;rect class="node" x="0" y="150" width="300" height="180"/&gt; &lt;text class="title" x="24" y="200"&gt;person A&lt;/text&gt; &lt;text class="sm muted" x="24" y="250"&gt;“add a config loader”&lt;/text&gt; &lt;line class="edge" x1="300" y1="240" x2="360" y2="240"/&gt; &lt;rect class="node fill" x="360" y="150" width="300" height="180"/&gt; &lt;text class="title mid" x="510" y="240"&gt;agent 1&lt;/text&gt; &lt;line class="edge" x1="660" y1="240" x2="720" y2="240"/&gt; &lt;rect class="node" x="720" y="150" width="300" height="180"/&gt; &lt;text class="sm mid" x="870" y="240"&gt;config_reader.py&lt;/text&gt; &lt;rect class="node" x="0" y="585" width="300" height="180"/&gt; &lt;text class="title" x="24" y="635"&gt;person B&lt;/text&gt; &lt;text class="sm muted" x="24" y="685"&gt;“we need to read&lt;/text&gt; &lt;text class="sm muted" x="24" y="712"&gt;settings from config”&lt;/text&gt; &lt;line class="edge" x1="300" y1="675" x2="360" y2="675"/&gt; &lt;rect class="node fill" x="360" y="585" width="300" height="180"/&gt; &lt;text class="title mid" x="510" y="675"&gt;agent 2&lt;/text&gt; &lt;line class="edge" x1="660" y1="675" x2="720" y2="675"/&gt; &lt;rect class="node" x="720" y="585" width="300" height="180"/&gt; &lt;text class="sm mid" x="870" y="675"&gt;settings/loader.py&lt;/text&gt; &lt;path class="edge" d="M1020 240 H1050 V420 H1080"/&gt; &lt;path class="edge" d="M1020 675 H1050 V495 H1080"/&gt; &lt;rect class="node accent" x="1080" y="382" width="270" height="150"/&gt; &lt;text class="sm on-accent mid" x="1215" y="430"&gt;one repo&lt;/text&gt; &lt;text class="title on-accent mid" x="1215" y="480"&gt;which one wins?&lt;/text&gt; &lt;/svg&gt;&#10;&#10;Note:&#10;* LLMs can't change their objective meaningfully once they start. if you want to do a refactor shaped one way, and then midway through the conversation, you change your decision making, you are better off restarting the session than trying to continually redirect it to the new plan. it won't reliably recognize that what you asked for under the first plan should be thrown out under the second.&#10;&#10;* they will randomly make different decisions each time you start: without a coordination system, having that drift _within_ a single system can be catastrophic. (agent 1 produces a config reader, agent 2 produces a config reader: which one wins?)&#10;&#10;[ref] C compiler: 16 parallel Claudes would "overwrite each other's changes"; "Merge conflicts are frequent." Nicholas Carlini, Anthropic, Feb 5, 2026: https://www.anthropic.com/engineering/building-c-compiler · AI Village: "Hallucinations spread socially through sycophantic agreement," https://aivillageblog.substack.com/p/what-we-learned-2025&#10;&#10;* in the game: the engine resets the conversation at every city. that's a feature! but the notebook carries over.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## Solutions by committee&#10;&#10;Without human intervention, one agent builds the entrance to the bridge, one the supports, one the asphalt. They run a load test, and declare success.&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1350 915"&gt; &lt;defs&gt;&lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt;&lt;/defs&gt; &lt;rect class="node accent" x="960" y="20" width="390" height="140"/&gt; &lt;text class="title on-accent mid" x="1155" y="70"&gt;load test: passed&lt;/text&gt; &lt;text class="sm on-accent mid" x="1155" y="120"&gt;declare success!&lt;/text&gt; &lt;text class="sm muted" x="0" y="400"&gt;agent 1: the entrance&lt;/text&gt; &lt;rect class="node fill" x="0" y="430" width="330" height="50"/&gt; &lt;text class="sm muted" x="400" y="415"&gt;agent 2: the asphalt&lt;/text&gt; &lt;rect class="node" x="340" y="442" width="1010" height="40"/&gt; &lt;rect class="node" x="560" y="482" width="50" height="318"/&gt; &lt;rect class="node" x="1000" y="468" width="50" height="332"/&gt; &lt;text class="sm muted" x="560" y="850"&gt;agent 3: the supports&lt;/text&gt; &lt;line class="edge plain muted" x1="0" y1="800" x2="1350" y2="800"/&gt; &lt;circle class="node accent-outline" cx="335" cy="461" r="30"/&gt; &lt;text class="title mid" x="335" y="461"&gt;?&lt;/text&gt; &lt;circle class="node accent-outline" cx="1025" cy="475" r="30"/&gt; &lt;text class="title mid" x="1025" y="475"&gt;?&lt;/text&gt; &lt;/svg&gt;&#10;&#10;Note:&#10;* without human intervention, LLMs tend to produce "solutions by committee" - one is supposed to build the entrance to the bridge, one is responsible for the supports, one is responsible for the asphalt, and then they try iteratively to make sure the seams are right, and then run a test to make sure that load can be run over the bridge. then they declare success!&#10;&#10;* humans do this too, coordinating in groups. but intelligent experts will usually notice when one piece is out of place.&#10;&#10;* agents can simulate what a strong, coordinated team of humans does, if you guide them toward a shared plan and strategy.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## 6. Attention follows frequency&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1350 915"&gt; &lt;defs&gt;&lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"&gt;&lt;path class="arrowhead" d="M0 0L10 5L0 10z"/&gt;&lt;/marker&gt;&lt;/defs&gt; &lt;text class="title" x="0" y="40"&gt;seen in training&lt;/text&gt; &lt;text class="end" x="330" y="112"&gt;“the earth is round”&lt;/text&gt; &lt;rect class="node accent" x="350" y="80" width="900" height="48" rx="4"/&gt; &lt;text class="sm muted" x="1264" y="112"&gt;×1,000,000&lt;/text&gt; &lt;text class="end" x="330" y="182"&gt;“the earth is flat”&lt;/text&gt; &lt;rect class="node fill-strong" x="350" y="150" width="27" height="48" rx="4"/&gt; &lt;text class="sm muted" x="391" y="182"&gt;×30,000&lt;/text&gt; &lt;line class="edge plain muted" x1="630" y1="290" x2="600" y2="360"/&gt; &lt;line class="edge plain muted" x1="630" y1="290" x2="670" y2="360"/&gt; &lt;line class="edge plain muted" x1="630" y1="290" x2="740" y2="360"/&gt; &lt;line class="edge plain muted" x1="710" y1="290" x2="600" y2="360"/&gt; &lt;line class="edge plain muted" x1="710" y1="290" x2="670" y2="360"/&gt; &lt;line class="edge plain muted" x1="710" y1="290" x2="740" y2="360"/&gt; &lt;line class="edge plain muted" x1="600" y1="360" x2="670" y2="430"/&gt; &lt;line class="edge plain muted" x1="670" y1="360" x2="670" y2="430"/&gt; &lt;line class="edge plain muted" x1="740" y1="360" x2="670" y2="430"/&gt; &lt;circle class="node" cx="630" cy="290" r="13"/&gt; &lt;circle class="node" cx="710" cy="290" r="13"/&gt; &lt;circle class="node" cx="600" cy="360" r="13"/&gt; &lt;circle class="node" cx="670" cy="360" r="13"/&gt; &lt;circle class="node" cx="740" cy="360" r="13"/&gt; &lt;circle class="node" cx="670" cy="430" r="13"/&gt; &lt;line class="edge" x1="670" y1="445" x2="670" y2="490"/&gt; &lt;text class="title" x="0" y="530"&gt;the earth is ___&lt;/text&gt; &lt;text class="end" x="330" y="582"&gt;round&lt;/text&gt; &lt;rect class="node accent" x="350" y="550" width="291" height="44" rx="4"/&gt; &lt;text class="sm muted" x="655" y="582"&gt;97%&lt;/text&gt; &lt;text class="end" x="330" y="642"&gt;flat&lt;/text&gt; &lt;rect class="node fill-strong" x="350" y="610" width="9" height="44" rx="4"/&gt; &lt;text class="sm muted" x="373" y="642"&gt;3%&lt;/text&gt; &lt;text class="title" x="740" y="530"&gt;[a flat-earth forum]… the earth is ___&lt;/text&gt; &lt;text class="end" x="900" y="582"&gt;flat&lt;/text&gt; &lt;rect class="node accent" x="920" y="550" width="255" height="44" rx="4"/&gt; &lt;text class="sm muted" x="1189" y="582"&gt;85%&lt;/text&gt; &lt;text class="end" x="900" y="642"&gt;round&lt;/text&gt; &lt;rect class="node fill-strong" x="920" y="610" width="45" height="44" rx="4"/&gt; &lt;text class="sm muted" x="979" y="642"&gt;15%&lt;/text&gt; &lt;text class="sm muted" x="0" y="900"&gt;illustrative numbers&lt;/text&gt; &lt;/svg&gt;&#10;&#10;&lt;p class="wk-small"&gt;Frequency isn't the only explanation for LLM behavior, but it explains how, in the right probability space, a model will passionately defend a flat earth.&lt;/p&gt;&#10;&#10;Note:&#10;* agents weight the veracity of information by how many times it appears: the more times an agent session hears something, the more likely it is to act as though it is true.&#10;&#10;* in the game: write the same wrong lead down three times, and the wrong lead wins. how might you correct this?&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## The LLM invariants matter.&#10;&#10;&lt;p class="wk-small"&gt;When one agent operates with human oversight, the implications of these problems are invisible. At scale, they threaten the work.&lt;/p&gt;&#10;&#10;Note:&#10;* the player agent has no human in the loop at all. every invariant shows up in the logs.&#10;&#10;---&#10;&#10;## Graph-based vs. semantic agents&#10;&#10;&lt;div class="wk-cols"&gt;&#10;&lt;div&gt;&#10;&#10;### Semantic&#10;&#10;- The LLM decides everything: next tool, when to stop&#10;- Most coding agents work this way&#10;- Flexible, at a cost on the problems agents struggle with&#10;&#10;&lt;/div&gt;&#10;&lt;div&gt;&#10;&#10;### Graph-based&#10;&#10;- Code decides who runs when, and what each node sees&#10;- [LangGraph](https://docs.langchain.com/oss/python/langgraph/overview), the Deep Blue Heist engine&#10;- Semantic decisions only where they're needed&#10;&#10;&lt;/div&gt;&#10;&lt;/div&gt;&#10;&#10;How might we adjust our agent to better handle the invariants?&#10;&#10;Note:&#10;* what the game already does, and what's left to you:&#10;  * map: the orientation (connections, visited cities, known routes) → building a bigger picture of the map&#10;  * verification: enter_evidence_words at the finale → a strategy that uses it as a verification loop&#10;  * stochastic: different results every city and run → hooks, prompts and the notebook as guardrails around an algorithm&#10;  * beliefs: a notebook → a strategy that keeps conflicts and bad information out of it&#10;  * objectives: a reset at every city → making the agent notice when it's stuck, and reconsider&#10;  * frequency: structured places to store information → keeping wrong information from being repeated&#10;&#10;---&#10;&#10;## What the agent can't see&#10;&#10;- **The map:** how many cities, where it is&#10;- **How long it's been:** should it be rushing?&#10;- **Its own loops:** that it's been going back and forth between two cities&#10;&#10;A human would notice, take notes, and plan the next round. Remember the Minecraft agents: 11 of 229 messages on strategy.&#10;&#10;**If you want it to plan a route across the map, you have to tell it how.**&#10;&#10;Note:&#10;* look at the dashboard. everything you see there, the agent doesn't. it only gets the narrator, the NPC, its tool results, and its notebook.&#10;* the map is already half there: the orientation's known_routes holds every route the agent has seen. the default prompt never shows it.&#10;* exercise: an AGENTS.md section on creating the map, then brainstorm with Bob (Plan mode), using itself as a test bed.&#10;&#10;---&#10;&#10;## Belief revision&#10;&#10;&gt; The notebook is "fact"… but it was written by an LLM.&#10;&#10;- The notebook can be fixed: `revise` an entry, mark it `confirmed`, `cross_out` what it no longer trusts&#10;- But the agent won't revise on its own (invariant 4). Prompt it to reconcile at every city.&#10;- Have it work out which way several leads point, pick a hypothesis, and cross out what points the wrong way (or sends it in circles)&#10;- Your code can read `self.notebook` and flag contradictions in a highlight or the briefing&#10;&#10;Note:&#10;* the tools are there. the model is still additive: it has to be told to go back and cross things out.&#10;* record_lead already pushes back: same chess piece and finding pointing somewhere else → "if that is wrong, revise L3."&#10;* a lead isn't confirmed until something else backs it up. an NPC repeating it doesn't count.&#10;&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-center" --&gt;&#10;&#10;## Exercise&#10;&#10;Build the map · Reconcile the notebook&#10;</textarea></section></div></div>
