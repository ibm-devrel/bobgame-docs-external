  <div class="reveal" data-deck="module-0" data-mode="present"><div class="slides"><section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Note:"><textarea data-template>&lt;!-- .slide: class="wk-title" --&gt;&#10;&#10;&lt;p class="wk-eyebrow"&gt;Module 0 · 15 min&lt;/p&gt;&#10;&#10;# What is the Deep Blue Heist?&#10;&#10;How IBM Bob works, and the real basics of AI coding assistants&#10;&#10;---&#10;&#10;## In this workshop, you'll learn&#10;&#10;- What agents are, and how to use one&#10;- How to build and improve an agent for simple problem-solving&#10;- How to apply agentic techniques to complicated, real-world problems&#10;- How to build an experimental framework for your agents&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-section" --&gt;&#10;&#10;## The Game&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## The Heist&#10;&#10;A supervillain called **The Architect** has stolen the **Deep Blue** drive: a crucial piece of IBM history.&#10;&#10;Your agent chases The Architect across cities, talks to NPCs, finds leads in IBM's databases, and recovers the drive as fast as possible.&#10;&#10;**You don't play the game.** You improve the agent that does, with IBM Bob.&#10;&#10;&lt;img src="/bobgame-docs-external/assets/agent-starts.png" alt="The main game page: the map, the agent's progress, and the conversation log"&gt;&#10;&#10;Note:&#10;Deep Blue: the chess supercomputer IBM built, which beat Garry Kasparov in 1997.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-chart" --&gt;&#10;&#10;## Two agents&#10;&#10;&lt;svg xmlns="http://www.w3.org/2000/svg" class="wk-diagram" viewBox="0 0 1700 857" role="img" aria-labelledby="bva-title"&gt; &lt;title id="bva-title"&gt;Bob writes player_agent.py, which defines the PlayerAgent; the PlayerAgent is the one that plays the game, starting in Armonk.&lt;/title&gt; &lt;defs&gt; &lt;marker id="wk-arrow" viewBox="0 0 10 10" refX="9" refY="5" mar 1281.6" cy="326.5" r="9"/&gt; &lt;circle class="map-city" cx="1377.1" cy="334.9" r="9"/&gt; &lt;circle class="map-city" cx="1489.6" cy="275.4" r="9"/&gt; &lt;circle class="map-city" cx="1602.2" cy="525.7" r="9"/&gt; &lt;rect class="map-pill" x="736" y="418" width="82" height="26" rx="4"/&gt; &lt;text class="map-label" x="777" y="431"&gt;Armonk&lt;/text&gt; &lt;rect class="map-pill" x="610.1" y="364.4" width="93" height="26" rx="4"/&gt; &lt;text class="map-label" x="656.6" y="377.4"&gt;Toronto&lt;/text&gt; &lt;rect class="map-pill" x="1240.6" y="345.5" width="82" height="26" rx="4"/&gt; &lt;text class="map-label" x="1281.6" y="358.5"&gt;Dublin&lt;/text&gt; &lt;rect class="map-pill" x="1319.6" y="353.9" width="115" height="26" rx="4"/&gt; &lt;text class="map-label" x="1377.1" y="366.9"&gt;Amsterdam&lt;/text&gt; &lt;rect class="map-pill" x="1432.1" y="294.4" width="115" height="26" rx="4"/&gt; &lt;text class="map-label" x="1489.6" y="307.4"&gt;Stockholm&lt;/text&gt; &lt;rect class="map-pill" x="1566.7" y="544.7" width="71" height="26" rx="4"/&gt; &lt;text class="map-label" x="1602.2" y="557.7"&gt;Cairo&lt;/text&gt; &lt;/g&gt; &lt;rect class="frame" x="600" y="150" width="1060" height="513" rx="12"/&gt; &lt;text class="sm muted" x="600" y="134"&gt;the game (6-city map)&lt;/text&gt; &lt;line class="edge speech" x1="520" y1="724" x2="980" y2="724"/&gt; &lt;path class="chat-bubble player" d="M1002 697 H1638 Q1650 697 1650 709 V810 L1662 827 H1002 Q990 827 990 815 V709 Q990 697 1002 697 Z"/&gt; &lt;text class="chat-icon" x="1012" y="730"&gt;🕵️&lt;/text&gt; &lt;text class="chat-name" x="1044" y="730"&gt;INVESTIGATOR&lt;/text&gt; &lt;rect class="chat-badge" x="1542" y="717" width="86" height="26" rx="13"/&gt; &lt;text class="chat-badge-text" x="1585" y="730"&gt;Armonk&lt;/text&gt; &lt;text class="chat-text" x="1012" y="773"&gt;I need to get oriented and start investigating. Let me&lt;/text&gt; &lt;text class="chat-text" x="1012" y="801"&gt;check my journal first to see what I know so far.&lt;/text&gt; &lt;line class="edge agent" x1="520" y1="690" x2="687.6" y2="455.4"/&gt; &lt;/svg&gt;&#10;&#10;Note:&#10;* Bob: the **coding agent** we use to change the game code.&#10;* The **player agent** (the Investigator in the game): the agent we develop and change using Bob.&#10;&#10;---&#10;&#10;## Why this game?&#10;&#10;- Agents both struggle with and solve complex problems on the map&#10;- Like real-world problems: layers of information, answers to keep track of, an end goal to stay aware of while focusing on the job at hand&#10;- Built for every level of development experience&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## How to play&#10;&#10;1. Pick your investigation tools in the MCP shop&#10;2. Watch your agent play&#10;3. Change the agent with Bob&#10;4. **New Game**, and compare&#10;&#10;Instructions: the [player guide](/bobgame-docs-external/booth/player-guide/).&#10;&#10;&lt;img src="/bobgame-docs-external/assets/mcp-shop.png" alt="The MCP shop: choosing investigation tools before the game"&gt;&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-section" --&gt;&#10;&#10;## IBM Bob&#10;&#10;---&#10;&#10;## What is an AI coding agent?&#10;&#10;- A tool that helps developers generate, debug, and analyze code&#10;- IBM Bob, Claude, Cursor&#10;- Analyzes problems and implements solutions in your codebase, without losing track of your progress&#10;&#10;Good prompts give the agent context: what the core problem is, and what information it has to work with.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## How IBM Bob works&#10;&#10;- Works directly in your repository: inspects, navigates, and changes files&#10;- Runs commands, tests, and build scripts, and reads the output in the chat&#10;- Asks for your approval before it reads, writes, or runs anything (by default)&#10;- Saves **checkpoints** as it works: review diffs, roll back changes&#10;&#10;&lt;img src="/bobgame-docs-external/assets/bob-window.png" alt="IBM Bob open next to the game code"&gt;&#10;&#10;---&#10;&#10;## Prompting and rules: `AGENTS.md`&#10;&#10;- A Markdown file in the repo root: Bob's persistent instruction manual&#10;- Rules Bob follows before making changes: style, which files to target or ignore, strategies&#10;- Ours keeps Bob focused on `player_agent.py`, explains the goal of the game, and offers strategy ideas&#10;&#10;Take a look at `AGENTS.md` now.&#10;&#10;---&#10;&#10;## Bob's modes&#10;&#10;| Mode | Use it for | Most useful for |&#10;|---|---|---|&#10;| **Ask** | Questions about the docs, the code, anything technical | Understanding the code without changing anything |&#10;| **Plan** | A deliberate plan before changes are applied | Breaking down complex problems, brainstorming solutions |&#10;| **Agent** | Writing and refactoring code | Applying changes to the agent: new code, changes, bug fixes |&#10;&#10;Note:&#10;You'll probably use Agent mode most often. You can also add custom modes in the Modes tab of Bob's settings.&#10;&#10;---&#10;&#10;## Bob permissions&#10;&#10;- Permissions let Bob do more without asking&#10;- For this workshop, the code isn't sensitive: we recommend giving Bob **full permissions**&#10;- Prefer to approve each action yourself? Leave them unchecked.&#10;&#10;---&#10;&#10;&lt;!-- .slide: class="wk-media" --&gt;&#10;&#10;## Exercise: Try the game&#10;&#10;1. Run the game with the default player agent&#10;2. Use Bob to make **one** change to your agent&#10;3. Hit **New Game**, and run it again&#10;&#10;Not sure what changed? Ask Bob to compare the logs.&#10;&#10;&lt;img src="/bobgame-docs-external/assets/re-run.png" alt="Starting a new game after changing the agent"&gt;&#10;&#10;Note:&#10;Example prompt (Agent mode): "Hi Bob, look at the logs that are updating as the agent plays the game. Could you outline what issues the agent may be having with completing the game faster, and make changes to the player agent file based on what you find?"&#10;&#10;Ask Bob to summarize its work as you go: part of spec-driven development, where you keep track of what you're building with AI by writing, and checking against, detailed specs.&#10;</textarea></section></div></div>
